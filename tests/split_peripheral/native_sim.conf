CONFIG_GPIO=n
CONFIG_ZMK_BLE=n
CONFIG_LOG=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_SETTINGS=y

# Peripheral role (CONFIG_ZMK_SPLIT_ROLE_CENTRAL unset = n): exercises
# src/split/watchdog_relay.c's peripheral executor against a real (in-RAM)
# watchdog store, via the CONFIG_ZMK_WATCHDOG_SPLIT_RELAY_TEST self-test
# (see DESIGN.md SS7). native_sim cannot exercise the real split BLE
# transport end-to-end, so this synthesizes a relayed request locally
# instead of over the air.
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
# Default (128) is too small for the largest relayed message -- a
# RelayResponse wrapping a full 3-incident IncidentPageResponse needs ~230
# bytes (see watchdog.options and Kconfig help for ZMK_WATCHDOG_SPLIT_RELAY).
# Comfortably under the relay transport's 255-byte hard ceiling
# (relay_event_header.event_data_size is a uint8_t).
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240

CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_FREEZE_DETECT=n
CONFIG_ZMK_WATCHDOG_FATAL_DETECT=n
CONFIG_ZMK_WATCHDOG_SPLIT_RELAY=y
CONFIG_ZMK_WATCHDOG_SPLIT_RELAY_TEST=y
