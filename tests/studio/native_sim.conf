CONFIG_GPIO=n
CONFIG_ZMK_BLE=n
CONFIG_LOG=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_ZMK_LOG_LEVEL_DBG=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC_TEST=y

# Test/fault injection over Studio RPC (DESIGN.md SS4.4): exercised by
# src/test/watchdog_rpc_test.c's InjectFreeze case. Freeze timeout is kept
# small here (same reasoning as tests/watchdog/native_sim.conf) so the
# freeze-via-RPC test, which sleeps past it, stays fast.
CONFIG_ZMK_WATCHDOG_TEST_INJECTION=y
CONFIG_ZMK_WATCHDOG_FREEZE_TIMEOUT_MS=200

CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=128
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=96
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_PRINT_LIST_ON_START=y

# CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE intentionally left at its framework
# default: the Studio RPC TX path is a genuine streaming ring buffer that
# never needs a whole response to fit in one buffer (DESIGN.md SS7.2).
