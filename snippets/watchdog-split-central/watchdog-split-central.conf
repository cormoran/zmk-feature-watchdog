# Combine with watchdog-split-rpc-relay for a central-role split build.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y
# IncidentPage responses (up to 3 incidents per page) need more than the
# default 64-byte TX buffer -- see the BUILD_ASSERT in
# src/studio/watchdog_handler.c.
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=512
