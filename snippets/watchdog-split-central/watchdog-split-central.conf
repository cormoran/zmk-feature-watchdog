# Combine with watchdog-split-rpc-relay for a central-role split build.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y
# CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE intentionally left at its framework
# default -- the Studio RPC TX path is a genuine streaming ring buffer that
# never needs a whole IncidentPage response to fit in one buffer
# (DESIGN.md SS7.2).
