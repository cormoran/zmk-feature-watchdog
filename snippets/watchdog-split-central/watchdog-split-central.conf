# Combine with watchdog-split-rpc-relay for a central-role split build.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y
# CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE intentionally left at its framework
# default -- the Studio RPC TX path is a genuine streaming ring buffer that
# never needs a whole IncidentPage response to fit in one buffer
# (DESIGN.md SS7.2).

# A split-central build runs the BLE controller in both central and
# peripheral roles at once, on top of an already extremely tight
# (~275us) radio-event-preparation timing budget (DESIGN.md SS12.1). This
# module's own periodic feed timers are one more source of the brief
# irq_lock()-style critical sections that can occasionally coincide with
# that budget and trip the controller's own LL_ASSERT_OVERHEAD safety
# check. These settings trade a little freeze-detection coverage/latency
# for less of that timer footprint on the role where it's been observed
# to matter; they are a mitigation, not a guarantee -- see DESIGN.md
# SS12.1 for what was and wasn't proven.
CONFIG_ZMK_WATCHDOG_FREEZE_MONITOR_LOWPRIO_QUEUE=n
CONFIG_ZMK_WATCHDOG_FREEZE_FEED_DIVISOR=2
