# Base split-relay config: peripheral role by default (CONFIG_ZMK_SPLIT_ROLE_CENTRAL
# unset). Combine with the watchdog-split-central snippet for a central-role build.
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
# See watchdog.options and Kconfig help for ZMK_WATCHDOG_SPLIT_RELAY: the
# largest relayed message (a RelayResponse wrapping a full 3-incident
# IncidentPageResponse) needs ~230 bytes, comfortably under the transport's
# 255-byte hard ceiling but well above the 128 default.
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240

CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_SPLIT_RELAY=y
