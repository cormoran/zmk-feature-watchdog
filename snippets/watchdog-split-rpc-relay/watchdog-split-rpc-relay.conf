# Base split-relay config: peripheral role by default (CONFIG_ZMK_SPLIT_ROLE_CENTRAL
# unset). Combine with the watchdog-split-central snippet for a central-role build.
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
# CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN intentionally left at its framework
# default (128): a ListIncidents answer streams one incident per relay event
# instead of embedding a whole page in one relay event (DESIGN.md SS7.1), so
# the largest watchdog relay message (one Incident + envelope) comfortably
# fits well under the default -- see the BUILD_ASSERTs in
# src/split/watchdog_relay.c.

CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_SPLIT_RELAY=y
